name: M43-P6 isolated physical campaign
on:
  push:
    branches: [research/m43-p6-spatial-consistency]
  pull_request:
    paths: ['experiments/**', 'validation/m43-p6/**', '.github/workflows/m43-p6.yml']
jobs:
  physical-consistency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-validation.lock
      - run: python -m pytest experiments/m43_p6 -q
      - run: python validation/m43-p6/reproduce.py
      - run: python validation/m43-p6/reproduce.py --material-curvature
      - run: python validation/m43-p6/reproduce.py --material-curvature --case sway --refined-sway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m43-p6-physical-${{ matrix.os }}
          path: .tools/m43-p6/
