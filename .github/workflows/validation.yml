name: Validate JPN calculations
on: [push, pull_request]

jobs:
  independent-pdelta-diagnostics:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            reference-python: .tools/opensees/bin/python
          - os: windows-latest
            reference-python: .tools/opensees/Scripts/python.exe
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-validation.lock
      - run: python -m pip install --no-build-isolation --no-deps -e ./engine
      - run: python -m venv .tools/opensees
      - run: ${{ matrix.reference-python }} -m pip install --require-hashes -r validation/m43-p2/requirements-opensees.lock
      # This job validates diagnostic execution and fail-closed behavior.
      # It DOES NOT declare all PyNite/OpenSees comparisons equivalent:
      # every discrepancy is retained in the artifact without relaxed bounds.
      - run: python validation/m43-p2/reproduce.py --opensees-python ${{ matrix.reference-python }} --output .tools/m43-p2-independent-evidence.json
      # Separate mandatory quality layer: frozen P2 drift bounds AND every
      # component of the equivalent P3/OpenSees Corotational comparisons.
      # Safe rejection alone cannot make these comparisons pass.
      - run: python validation/m43-p3/reproduce.py --opensees-python ${{ matrix.reference-python }} --p2-evidence .tools/m43-p2-independent-evidence.json --output .tools/m43-p3-independent-evidence.json
      # P4 planar reference estimates and verified spatial limits are mandatory.
      # General spatial discrepancies remain blocked and cannot deteriorate
      # beyond their committed diagnostic baseline. Never re-record it in CI.
      - run: python validation/m43-p4/reproduce.py --opensees-python ${{ matrix.reference-python }} --p3-evidence .tools/m43-p3-independent-evidence.json --output .tools/m43-p4-independent-evidence.json
      # P5 compares physical SO(3) orientations, not incompatible raw DOFs.
      # A strict cantilever regression is mandatory. Remaining failed cases
      # and the unchanged 20s/768MiB worker guards remain explicit in evidence.
      - run: python validation/m43-p5/reproduce.py --opensees-python ${{ matrix.reference-python }} --output .tools/m43-p5-independent-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-pdelta-diagnostic-evidence-${{ matrix.os }}
          path: |
            .tools/m43-p2-independent-evidence.json
            .tools/m43-p3-independent-evidence.json
            .tools/m43-p4-independent-evidence.json
            .tools/m43-p5-independent-evidence.json

  structural:
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-validation.lock
      - run: python -m pip install --no-build-isolation --no-deps -e ./engine
      - run: python -m pip check
      - run: python validation/geometric-stiffness-audit/kg_reference.py
      - run: python engine/validate.py
      - run: python engine/audit_loading.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-validation-${{ matrix.os }}
          path: engine/validation-results/

  application:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validation/integration-general/audit.py
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r engine/requirements-sections.lock
      - run: .venv/bin/python -m pip install --no-build-isolation --no-deps -e ./engine
      - run: python -m venv .tools/sections-fsm
      - run: .tools/sections-fsm/bin/python -m pip install -r engine/requirements-sections-fsm.lock
      - run: npx --yes pnpm@12.15.0 install --frozen-lockfile
      - run: node validation/ufsc-2023/validate-reference.mjs
      - run: npx --yes pnpm@12.15.0 typecheck
      - run: npx --yes pnpm@12.15.0 lint
      - run: npx --yes pnpm@12.15.0 test
        env:
          JPN_SECTION_FSM_PYTHON_EXECUTABLE: .tools/sections-fsm/bin/python
      - run: python validation/m49/summarize.py
      - run: .venv/bin/python tests/verify_dxf.py
      - run: npx --yes pnpm@12.15.0 exec playwright install --with-deps chromium
      - run: npx --yes pnpm@12.15.0 test:e2e
        env:
          JPN_SECTION_FSM_PYTHON_EXECUTABLE: .tools/sections-fsm/bin/python
      - run: npx --yes pnpm@12.15.0 build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-integration-browser-evidence
          path: |
            .tools/integration-general-runtime/
            .tools/m49-runtime/
            test-results/

  optional-numerical-profiles:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [sections, fsm, sections-fsm]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-${{ matrix.profile }}.lock
      - run: python -m pip check
      - if: matrix.profile == 'sections'
        run: python -m pytest engine/section_tests/test_section_properties.py engine/section_tests/test_verified_design.py engine/section_tests/test_exact_shape_cache.py -q
      - if: matrix.profile == 'fsm'
        run: python -m pytest engine/section_tests/test_elastic_strip.py -q
      - if: matrix.profile == 'sections-fsm'
        run: python -m pytest engine/section_tests/test_member_buckling.py engine/section_tests/test_modal_numerics.py engine/section_tests/test_modal_kinematics.py engine/section_tests/test_exact_shape_cache.py -q
